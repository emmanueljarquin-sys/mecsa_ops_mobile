name: APK de debug (pre-release)

# Compila el APK de debug de la rama de trabajo y lo publica como pre-release
# en GitHub Releases (no es una versión de producción: para pruebas internas).
# Producción sigue saliendo por Codemagic (codemagic.yaml) a Play Store.

on:
  push:
    branches:
      - Bug-Fixing---Steven
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.3"
          cache: true

      - name: Versión del pubspec
        id: ver
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._-\n' '-')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=debug-${VERSION}-${BRANCH}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "apk=mecsa_ops_mobile-${VERSION}-debug-${SHORT_SHA}.apk" >> "$GITHUB_OUTPUT"

      - name: google-services.json (secreto opcional)
        # Si el secreto existe, reemplaza el archivo versionado; si no, se usa el del repo.
        env:
          GOOGLE_SERVICES_JSON_ANDROID: ${{ secrets.GOOGLE_SERVICES_JSON_ANDROID }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_ANDROID" ]; then
            echo "$GOOGLE_SERVICES_JSON_ANDROID" | base64 --decode > android/app/google-services.json
            echo "google-services.json inyectado desde secreto"
          else
            echo "Usando android/app/google-services.json del repositorio"
          fi

      - name: Dependencias
        run: flutter pub get

      - name: Íconos
        run: dart run flutter_launcher_icons

      - name: Análisis estático
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK de debug
        run: |
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk "${{ steps.ver.outputs.apk }}"
          ls -la "${{ steps.ver.outputs.apk }}"

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.apk }}
          path: ${{ steps.ver.outputs.apk }}
          retention-days: 14

      - name: Publicar pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Debug ${{ steps.ver.outputs.version }} · ${{ github.ref_name }} · #${{ github.run_number }}"
          prerelease: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            APK de **debug** de la rama `${{ github.ref_name }}` (commit `${{ github.sha }}`).
            Solo para pruebas internas: no es la versión de producción de Play Store.

            Instalación: descarga el APK, permite orígenes desconocidos e instala.
            Si ya tienes la versión de Play Store instalada, desinstálala primero (las firmas no coinciden).
          files: ${{ steps.ver.outputs.apk }}
